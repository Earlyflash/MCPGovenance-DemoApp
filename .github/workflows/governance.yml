name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governed:
    uses: Earlyflash/MCPGovenance/.github/workflows/governed-pr.yml@main
